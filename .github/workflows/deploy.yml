name: CI/CD Pipeline - MLOps Lab 5

on:
  push:
    branches:
      - main
    paths:
      - 'lab5/**'
      - '.github/workflows/deploy.yml'

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-size: '3.11'
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r lab5/requirements.txt pytest httpx

      - name: Run Unit Tests
        run: |
          export PYTHONPATH=lab5
          pytest lab5/test_app.py -v

      - name: Log in to Docker Hub
        if: success()
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and Push Docker Image
        if: success()
        uses: docker/build-push-action@v5
        with:
          context: ./lab5
          file: ./lab5/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/boston-housing-app:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/boston-housing-app:${{ github.sha }}

      - name: Deploy to Hugging Face Spaces
        if: success()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME }}
        run: |
          # 1. Create a temporary folder and clone the Space repo
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          
          # Initialize git and fetch Hugging Face repo
          mkdir -p hf_sync_dir
          cd hf_sync_dir
          git init
          git remote add origin https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE_NAME}
          
          # Pull latest changes to avoid conflicts, or handle empty space repo
          git pull origin main || echo "Starting fresh Space repository"
          
          # 2. Copy the contents of the lab5 folder into the synced repo root
          cp -r ../lab5/* .
          
          # Remove test files from the Hugging Face repo if desired (optional)
          rm -f test_app.py
          
          # 3. Commit and push to Hugging Face
          git add -A
          # Only commit and push if there are changes
          if ! git diff-index --quiet HEAD; then
            git commit -m "Sync from GitHub: ${{ github.event.head_commit.message }} (${{ github.sha }})"
            git push origin HEAD:main --force
          else
            echo "No changes to sync."
          fi
